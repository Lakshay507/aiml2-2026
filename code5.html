<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>object  date operations</title>
</head>
<body>
    <script>
        let a=new Date();
        document.write(a);
        document.write("<br>");
        let b=a.getDate();
        document.write(b);
        let c=a.getDay();   
        document.write("<br>");
        document.write(c);
        let d=a.getFullYear();
        document.write("<br>");
        document.write(d);
        let e=a.getHours();
        document.write("<br>");
        document.write(e);
        let f=a.getMilliseconds();
        document.write("<br>");
        document.write(f);
        let g=a.getMinutes();
        document.write("<br>");
        document.write(g);
        let h=a.getMonth(); 
        document.write("<br>");
        document.write(h);
        let i=a.getSeconds();
        document.write("<br>");
        document.write(i);
        let j=a.setDate(15);
        document.write("<br>");
        document.write(j);
        let k=a.setFullYear(2025);
        document.write("<br>");
        document.write(k);
    </script>
</body>
</html>
