<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>object number operations</title>
</head>
<body>
    <script>
        let a=10;
        let b=20;
        let c=a+b;
        document.write(c);document.write("<br>");
        let d=a-b;
        document.write(d);document.write("<br>");
        let e=a*b;
        document.write(e);document.write("<br>");
        let f=a/b;
        document.write(f);document.write("<br>");
        let g=a%b;
        document.write(g);document.write("<br>");
        let h=Math.sqrt(a);
        document.write(h);document.write("<br>");
        let i=Math.pow(a,2);
        document.write(i);document.write("<br>");
        let j=Math.round(4.5);
        document.write(j);document.write("<br>");
        let k=Math.floor(4.9);
        document.write(k);document.write("<br>");
        let l=Math.ceil(4.1);
        document.write(l);document.write("<br>");</script>
</body>
</html>
