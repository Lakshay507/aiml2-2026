<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create your account</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #172033;
            --muted: #667085;
            --surface: rgba(255, 255, 255, 0.94);
            --line: #d9deea;
            --accent: #3157d5;
            --accent-dark: #2443aa;
            --focus: rgba(49, 87, 213, 0.2);
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 32px 16px;
            color: var(--ink);
            font-family: Georgia, "Times New Roman", serif;
            background:
                radial-gradient(circle at 12% 12%, rgba(255, 218, 142, 0.45), transparent 30%),
                linear-gradient(135deg, #f4f7ff 0%, #e8edf9 50%, #f9f5ec 100%);
        }

        .form-card {
            width: min(100%, 480px);
            padding: clamp(28px, 6vw, 52px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 8px;
            background: var(--surface);
            box-shadow: 0 24px 70px rgba(32, 46, 85, 0.16);
        }

        .eyebrow {
            margin: 0 0 8px;
            color: var(--accent);
            font-family: Arial, sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 7vw, 3rem);
            line-height: 1;
        }

        .intro {
            margin: 14px 0 30px;
            color: var(--muted);
            font-family: Arial, sans-serif;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .field {
            display: grid;
            gap: 8px;
            margin-bottom: 18px;
        }

        label,
        legend {
            font-family: Arial, sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid var(--line);
            border-radius: 4px;
            color: var(--ink);
            font: 1rem Arial, sans-serif;
            background: #fff;
            transition: border-color 160ms ease, box-shadow 160ms ease;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--focus);
        }

        fieldset {
            margin: 4px 0 26px;
            padding: 0;
            border: 0;
        }

        legend {
            margin-bottom: 12px;
        }

        .radio-options {
            display: flex;
            gap: 22px;
            color: var(--muted);
            font-family: Arial, sans-serif;
        }

        .radio-options label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 400;
            cursor: pointer;
        }

        input[type="radio"] {
            accent-color: var(--accent);
        }

        button[type="submit"] {
            width: 100%;
            padding: 14px 18px;
            border: 0;
            border-radius: 4px;
            color: #fff;
            font: 700 0.9rem Arial, sans-serif;
            letter-spacing: 0.03em;
            background: var(--accent);
            cursor: pointer;
            transition: background 160ms ease, transform 160ms ease;
        }

        button[type="submit"]:hover {
            background: var(--accent-dark);
            transform: translateY(-1px);
        }

        button[type="submit"]:focus-visible {
            outline: 3px solid var(--focus);
            outline-offset: 3px;
        }

        @media (max-width: 420px) {
            body {
                padding: 16px 10px;
            }

            .form-card {
                padding: 28px 20px;
            }
        }
    </style>
</head>
<body>
    <script>
        function validation() {
            let uname = document.getElementById("uname").value;
            if(uname == "" || typeof uname != "string") {
                alert("Please fill in your name");
                return false;
            }
            let email = document.getElementById("email").value;
            if(email == "" || !email.includes("@")) {
                alert("Please enter a valid email address");
                return false;
            }
            let password = document.getElementById("password").value;
            if(password == "" || password.length < 6) {
                alert("Please enter a password with at least 6 characters");
                return false;
            }
            let cpassword = document.getElementById("cpassword").value;
            if(cpassword == "" || cpassword != password) {
                alert("Please enter the same password in both fields");
                return false;
            }
            let gender = document.getElementsByName("gender");
            let genderSelected = false;
            for(let i = 0; i < gender.length; i++) {
                if(gender[i].checked) {
                    genderSelected = true;
                    break;
                }
            }
            if(!genderSelected) {
                alert("Please select your gender");
                return false;
            }
        }
    </script>
    <main class="form-card">
        <p class="eyebrow">Welcome</p>
        <h1>Registration Form</h1>
        <p class="intro">Enter your details ....</p>
        <form onsubmit="return validation()">
            <div class="field">
                <label for="uname">Name</label>
                <input type="text" id="uname" placeholder="Enter your name" required>
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="At least 6 characters" minlength="6" required>
            </div>
            <div class="field">
                <label for="cpassword">Confirm password</label>
                <input type="password" id="cpassword" placeholder="Confirm  your password" required>
            </div>
            <fieldset>
                <legend>Gender</legend>
                <div class="radio-options">
                    <label><input type="radio" name="gender" value="male" required> Male</label>
                    <label><input type="radio" name="gender" value="female"> Female</label>
                </div>
            </fieldset>
            <button type="submit">Create account</button>
        </form>
    </main>
    </form> 
</body>
</html>
